<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Davii Concept</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('assets/tejuosho 1.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
        }

        .container {
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('assets/tejuosho 1.png');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(8px);
            padding: 35px 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .container h2 {
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-align: center;
            font-size: 26px;
            color: #ffffff;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .input-group {
            margin-bottom: 20px;
            width: 100%;
        }

        .container input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            transition: border-color 0.3s;
        }

        .container input:focus {
            border-color: #228B22;
            box-shadow: 0 0 5px rgba(34, 139, 34, 0.5);
        }

        .container button {
            background-color: #228B22;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 5px;
        }

        .container button:hover {
            background-color: #1e7b1e;
        }

        .container button:active {
            transform: scale(0.98);
        }

        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .form-footer a {
            color: #FFD700;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            .container h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <form action="./home.html" method="POST">
            <h2>Sign In</h2>

            <div class="input-group">
                <input type="text" placeholder="Username or Email" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit">Login</button>

            <div class="form-footer">
                <p><a href="#">Forgot Password?</a></p>
                <p style="margin-top: 10px;">Don't have an account? <a href="register.html">Register</a></p>
            </div>
        </form>
    </div>

</body>
</html>
