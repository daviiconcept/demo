<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Davii Concept</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #333;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('assets/tejuosho 1.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 30px 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
            font-size: 26px;
            letter-spacing: 1px;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #f1f1f1;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #04aa6d;
            box-shadow: 0 0 5px rgba(4, 170, 109, 0.5);
        }

        .address-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="submit"] {
            background-color: #04aa6d;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        input[type="submit"]:hover {
            background-color: #038a58;
        }

        input[type="submit"]:active {
            transform: scale(0.98);
        }

        
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 22px;
            }

            label {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>REGISTER HERE</h1>

        <form action="/action_page.php" method="POST">
            <div class="form-group">
                <label for="name">NAME / ORGANISATION</label>
                <input type="text" id="name" name="name" placeholder="Enter Full Name or Organisation" required>
            </div>

            <div class="form-group">
                <label for="address">ADDRESS</label>
                <div class="address-group">
                    <input type="text" id="address" name="address" placeholder="Street Address" required>
                    <input type="text" id="city" name="city" placeholder="City" required>
                </div>
            </div>

            <div class="form-group">
                <label for="country">COUNTRY</label>
                <select id="country" name="country" required>
                    <option value="" disabled selected>Select Country</option>
                    <option value="nigeria">Nigeria</option>
                    <option value="ghana">Ghana</option>
                    <option value="togo">Togo</option>
                    <option value="egypt">Egypt</option>
                    <option value="south africa">South Africa</option>
                    <option value="zambia">Zambia</option>
                    <option value="tunisia">Tunisia</option>
                    <option value="algeria">Algeria</option>
                    <option value="zimbabwe">Zimbabwe</option>
                    <option value="rwanda">Rwanda</option>
                    <option value="angola">Angola</option>
                    <option value="ivory coast">Ivory Coast</option>
                    <option value="liberia">Liberia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="state">STATE OF ORIGIN</label>
                <select id="state" name="state" required>
                    <option value="" disabled selected>Select State</option>
                    <option value="abia">Abia</option>
                    <option value="adamawa">Adamawa</option>
                    <option value="akwaibom">Akwa Ibom</option>
                    <option value="anambra">Anambra</option>
                    <option value="bauchi">Bauchi</option>
                    <option value="bayelsa">Bayelsa</option>
                    <option value="benue">Benue</option>
                    <option value="borno">Borno</option>
                    <option value="crossriver">Cross River</option>
                    <option value="delta">Delta</option>
                    <option value="ebonyi">Ebonyi</option>
                    <option value="edo">Edo</option>
                    <option value="ekiti">Ekiti</option>
                    <option value="enugu">Enugu</option>
                    <option value="fct">FCT - Abuja</option>
                    <option value="gombe">Gombe</option>
                    <option value="imo">Imo</option>
                    <option value="jigawa">Jigawa</option>
                    <option value="kaduna">Kaduna</option>
                    <option value="kano">Kano</option>
                    <option value="katsina">Katsina</option>
                    <option value="kebbi">Kebbi</option>
                    <option value="kogi">Kogi</option>
                    <option value="kwara">Kwara</option>
                    <option value="lagos">Lagos</option>
                    <option value="nasarawa">Nasarawa</option>
                    <option value="niger">Niger</option>
                    <option value="ogun">Ogun</option>
                    <option value="ondo">Ondo</option>
                    <option value="osun">Osun</option>
                    <option value="oyo">Oyo</option>
                    <option value="plateau">Plateau</option>
                    <option value="rivers">Rivers</option>
                    <option value="sokoto">Sokoto</option>
                    <option value="taraba">Taraba</option>
                    <option value="yobe">Yobe</option>
                    <option value="zamfara">Zamfara</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" placeholder="eg: david4us4real@yahoo.com" required>
            </div>

            <div class="form-group">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" id="phone" name="phone" placeholder="eg: +234 8000000000" required>
            </div>

            <div class="form-group">
                <label for="next_of_kin">NEXT OF KIN</label>
                <input type="text" id="next_of_kin" name="next_of_kin" placeholder="Full Name of Next of Kin" required>
            </div>

            <div class="form-group">
                <label for="next_of_kin_phone">NEXT OF KIN PHONE</label>
                <input type="tel" id="next_of_kin_phone" name="next_of_kin_phone" placeholder="eg: +234 8000000000" required>
            </div>

            <input type="submit" value="Submit">
        </form>
    </div>

</body>
</html>
