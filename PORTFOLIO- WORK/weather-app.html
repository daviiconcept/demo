<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
  box-sizing: border-box;
}

body {
  font-family: 'Times New Roman', Times, serif;
  background-color: #f0f0f0;
  background-image: url('assets/weather.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.container {
  width: 100%;
  max-width: 400px;
  min-height: 300px;
  margin-top: 50px;
  padding: 20px;
  text-align: center;
  background-color: rgba(255, 255, 255, 0.5);
  border-radius: 10px;
}

h1 {
  font-size: 25px;
  margin-top: 0;
}

input[type="text"] {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 16px;
  outline: none;
}

button {
  background-color: blue;
  color: white;
  font-weight: bold;
  border: none;
  padding: 10px 20px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 10px;
  font-size: 16px;
}

button:hover {
  background-color: darkblue;
}

.weather-info {
  margin-top: 20px;
}


@media (max-width: 768px) {
  body {
    padding: 15px;
  }

  .container {
    max-width: 90%;
    margin-top: 30px;
  }

  h1 {
    font-size: 23px;
  }
}


@media (max-width: 480px) {
  body {
    padding: 10px;
  }

  .container {
    width: 100%;
    max-width: 100%;
    margin-top: 20px;
    padding: 15px;
    min-height: 280px;
  }

  h1 {
    font-size: 21px;
  }

  input[type="text"] {
    font-size: 15px;
    padding: 10px;
  }

  button {
    width: 100%;
    padding: 11px;
    font-size: 15px;
  }

  .weather-info {
    margin-top: 15px;
  }

  #location {
    font-size: 22px;
  }

  #temperature {
    font-size: 20px;
  }

  #description {
    font-size: 16px;
  }
}
</style>
<body>
  <div class="container">
    <h1>WEATHER APP</h1>
    <input type="text" id="locationInput" placeholder="Enter a city"> 
    <button id="locationButton">Search</button> 
    <div id="weather-info">
      <h2 id="location"></h2> 
      <p id="temperature"></p> 
      <p id="description"></p> 
    </div>
  </div>
  
  <script>

  
const apiKey = '23ee4ca69d95d4b227e092f7dbcee2f2';
const apiUrl = 'https://api.openweathermap.org/data/2.5/weather';
const locationInput = document.getElementById('locationInput'); 
const locationButton = document.getElementById('locationButton'); 
const locationElement = document.getElementById('location'); 
const temperatureElement = document.getElementById('temperature'); 
const descriptiveElement = document.getElementById('description');


locationButton.addEventListener('click', () => {
  const location = locationInput.value;
  if (location) {
    fetchWeather(location);
  }
});

function fetchWeather(location) {
  const url = `${apiUrl}?q=${location}&appid=${apiKey}&units=metric`;

  fetch(url)
    .then(response => response.json())
    .then(data => {
      locationElement.textContent = data.name;
      temperatureElement.textContent = `${Math.round(data.main.temp)}°C`;
      descriptiveElement.textContent = data.weather[0].description;
    })
    .catch(error => {
      console.error('Error fetching weather data:', error);
    });
}




  </script>
</body>
</html>
